
name: Keep only current snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Replace branch history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW=$(git commit-tree HEAD^{tree} -m "Current source")

          git push \
            --force-with-lease=refs/heads/main:${GITHUB_SHA} \
            origin "${NEW}:refs/heads/main"
